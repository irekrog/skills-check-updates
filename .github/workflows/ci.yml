name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the Ubuntu check names stable for branch protection.
          - name: Node.js 22.18.0
            os: ubuntu-latest
            node-version: '22.18.0'
          - name: Node.js 24
            os: ubuntu-latest
            node-version: '24'
          - name: Node.js 24 (macOS)
            os: macos-latest
            node-version: '24'
          - name: Node.js 24 (Windows)
            os: windows-latest
            node-version: '24'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test packed CLI
        shell: bash
        run: bash .github/scripts/smoke-package.sh
